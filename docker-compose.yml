version: '3.8'

services:
  usas-platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: usas-analytics:latest
    container_name: usas_platform
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - AUTH_SECRET_KEY=usas-maharashtra-urban-secret-key-2026-auth-token
      # Optional external API keys:
      # - GEMINI_API_KEY=${GEMINI_API_KEY}
      # - MONGODB_URI=${MONGODB_URI}
    volumes:
      - usas_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  usas_data:
    driver: local
